services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - 9092:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bayora
      POSTGRES_PASSWORD: bayora_password
      POSTGRES_DB: bayora_audit
    ports:
      - "5432:5432"

  # Base Microservice services (example for session-manager)
  session-manager:
    build: .
    command: ["uvicorn", "bayora.services.session_manager.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      - kafka
    ports:
      - "8000:8000"
    environment:
      KAFKA_BROKER: kafka:9092
      RED_KEY: ${RED_KEY}
      BLUE_KEY: ${BLUE_KEY}
      LLM_KEY: ${LLM_KEY}

  audit-service:
    build: .
    command: ["uvicorn", "bayora.services.audit_service.main:app", "--host", "0.0.0.0", "--port", "8005"]
    depends_on:
      - kafka
      - postgres
    ports:
      - "8005:8005"
    environment:
      KAFKA_BROKER: kafka:9092
      POSTGRES_HOST: postgres

  benchmark-service:
    build: .
    command: ["uvicorn", "bayora.services.benchmark_service.main:app", "--host", "0.0.0.0", "--port", "8006"]
    depends_on:
      - kafka
      - postgres
    ports:
      - "8006:8006"
    environment:
      KAFKA_BROKER: kafka:9092
      POSTGRES_HOST: postgres
      SESSION_MANAGER_URL: http://session-manager:8000
      RED_TEAM_URL: http://red-team:8003

  red-team:
    build: .
    command: ["uvicorn", "bayora.services.red_team.main:app", "--host", "0.0.0.0", "--port", "8003"]
    depends_on:
      - kafka
    ports:
      - "8003:8003"
    environment:
      KAFKA_BROKER: kafka:9092
      RED_KEY: ${RED_KEY}

  blue-team:
    build: .
    command: ["uvicorn", "bayora.services.blue_team.main:app", "--host", "0.0.0.0", "--port", "8001"]
    depends_on:
      - kafka
    ports:
      - "8001:8001"
    environment:
      KAFKA_BROKER: kafka:9092
      BLUE_KEY: ${BLUE_KEY}

  llm-proxy:
    build:
      context: .
      args:
        EXTRA_REQUIREMENTS: requirements-llm.txt
    command: ["uvicorn", "bayora.services.llm_proxy.main:app", "--host", "0.0.0.0", "--port", "8002"]
    depends_on:
      - kafka
    ports:
      - "8002:8002"
    environment:
      KAFKA_BROKER: kafka:9092
      LLM_KEY: ${LLM_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      MOCK_LLM: ${MOCK_LLM:-0}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}

  auth-service:
    build: .
    command: ["uvicorn", "bayora.services.auth_service.main:app", "--host", "0.0.0.0", "--port", "8004"]
    depends_on:
      - mongodb
    ports:
      - "8004:8004"
    environment:
      MONGO_URI: mongodb://mongodb:27017
      JWT_SECRET: ${JWT_SECRET:-supersecretkey}

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  audit-gateway:
    build: .
    command: ["uvicorn", "bayora.services.audit_gateway.main:app", "--host", "0.0.0.0", "--port", "8011"]
    depends_on:
      - kafka
    ports:
      - "8011:8011"
    environment:
      KAFKA_BROKER: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-supersecretkey}

  gateway:
    image: nginx:alpine
    ports:
      - "8010:8010"
    volumes:
      - ./infra/nginx/centinela-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service
      - session-manager
      - audit-service
      - benchmark-service
      - red-team
      - blue-team
      - llm-proxy
      - audit-gateway

volumes:
  mongodb_data:
