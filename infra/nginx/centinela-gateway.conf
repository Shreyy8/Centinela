server {
    listen 8010;
    client_max_body_size 10M;
    proxy_read_timeout 86400s;

    # CORS
    add_header Access-Control-Allow-Origin "http://localhost:8080" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    add_header Access-Control-Allow-Credentials "true" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    # Auth service (login, signup, config)
    location /api/auth/ {
        proxy_pass http://auth-service:8004/auth/;
    }
    location /api/config/ {
        proxy_pass http://auth-service:8004/config/;
    }

    # Session manager
    location /api/session/ {
        proxy_pass http://session-manager:8000/session/;
    }
    location /api/audit/verify/ {
        proxy_pass http://session-manager:8000/audit/verify/;
    }

    # Audit service
    location /api/verify {
        proxy_pass http://audit-service:8005/verify;
    }

    # Benchmark service (drills, leaderboard, datasets)
    location /api/drills/ {
        proxy_pass http://benchmark-service:8006/drills/;
    }
    location /api/leaderboard {
        proxy_pass http://benchmark-service:8006/leaderboard;
    }
    location /api/datasets {
        proxy_pass http://benchmark-service:8006/datasets;
    }

    # Red team
    location /api/attack/ {
        proxy_pass http://red-team:8003/attack/;
    }

    # Blue team
    location /api/evaluate/ {
        proxy_pass http://blue-team:8001/evaluate/;
    }

    # LLM Proxy
    location /api/llm/ {
        proxy_pass http://llm-proxy:8002/llm/;
    }

    # WebSocket Audit Gateway
    location /ws/ {
        proxy_pass http://audit-gateway:8011/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
