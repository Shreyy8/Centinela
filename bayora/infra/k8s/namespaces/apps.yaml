# LLM Proxy Deployment (Sandbox) — uses runtime-ml image stage (Task 4.1)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-proxy
  namespace: llm-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-proxy
  template:
    metadata:
      labels:
        app: llm-proxy
    spec:
      runtimeClassName: gvisor-sandboxed
      containers:
      - name: llm-proxy
        image: bayora/microservices-ml:latest   # ML-heavy image (PyTorch/vLLM/Transformers)
        imagePullPolicy: IfNotPresent
        command: ["uvicorn", "bayora.services.llm_proxy.main:app", "--host", "0.0.0.0", "--port", "8002"]
        env:
        - name: KAFKA_BROKER
          value: "bayora-cluster-kafka-bootstrap.kafka.svc:9092"
        envFrom:
        - secretRef:
            name: llm-proxy-keys
        ports:
        - containerPort: 8002

---
apiVersion: v1
kind: Service
metadata:
  name: llm-proxy
  namespace: llm-sandbox
spec:
  selector:
    app: llm-proxy
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8002

