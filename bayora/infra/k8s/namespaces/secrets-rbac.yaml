# Roles and RoleBindings for Secret Access

# --- RED TEAM NAMESPACE ---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader
  namespace: red-team
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["red-team-key"]
  verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: red-team-sa-secret-reader
  namespace: red-team
subjects:
- kind: ServiceAccount
  name: red-team-sa
  namespace: red-team
roleRef:
  kind: Role
  name: secret-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: session-manager-sa-secret-reader
  namespace: red-team
subjects:
- kind: ServiceAccount
  name: session-manager-sa
  namespace: session-manager
roleRef:
  kind: Role
  name: secret-reader
  apiGroup: rbac.authorization.k8s.io

