# Blue Team Network Policies
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: blue-team-egress
  namespace: blue-team
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  # Allow DNS resolution
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow egress to session-manager on port 8443
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: session-manager
    ports:
    - protocol: TCP
      port: 8443
  # Allow egress to Kafka
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kafka
    ports:
    - protocol: TCP
      port: 9092
    - protocol: TCP
      port: 9093
